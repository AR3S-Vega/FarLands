@Kopernicus:AFTER[FarLands] 
{
    @Body[Sun]
    {
		@Properties
		{
			%displayName = Intergalactic Void
			%description = The space inbetween galaxies, the intergalactic void is nothing for millions of light years. Compared to in interstellar space, where there is about 1 atom per cubic centimeter, in the void it is more like 1 atom per cubic meter, which is more a million times difference. There is nothing out here.
			%geeASL = 0.0001 //bare minimun. I think setting it to zero will break some stuff.
			%radius = 1
		}
        @ScaledVersion
        {
            %Light 
            {
				givesOffLight = false
                sunlightColor = 0,0,0,0
                scaledSunlightColor = 0,0,0,0
                IVASunColor = 0,0,0,0
                sunLensFlareColor = 0,0,0,0
                ambientLightColor = 0,0,0,0
				sunAU = 0
				IntensityCurve
				{   
					key = 0 		    0	    0 	0
				}
				ScaledIntensityCurve
				{ 
					key = 0 		    0	    0 	0
				}
				IVAIntensityCurve
				{  

					key = 0 		    0	    0 	0
				}
				brightnessCurve
				{
					key = 0 0 0 0
				}
            }
            Material
            {
                emitColor0 = 0,0,0,0
                emitColor1 = 0,0,0,0
                sunspotColor = 0,0,0,0
                rimColor = 0,0,0,0
            }
            Coronas
            {
                Corona
                {
                    rotation = 0
                    speed = -1
                    updateInterval = 5
                    scaleLimitX = 5
                    scaleLimitY = 5
                    scaleSpeed = 0.007

                    Material
                    {
                        texture = FarLands/PluginData/Core/Stars/Black.dds
                        inverseFade = 2.553731
                    }
                }
                Corona
                {
                    rotation = 0
                    speed = 1
                    updateInterval = 5
                    scaleLimitX = 5
                    scaleLimitY = 5
                    scaleSpeed = 0.009

                    Material
                    {
                        texture = FarLands/PluginData/Core/Stars/Black.dds
                        inverseFade = 2.553731
                    }
                }
            }
        }
    }
}